services:
  dashboardpscnew:
    container_name: dashboardpscnew
    image: dashboardpscnew:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/dashboard}
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - proxynet

networks:
  proxynet:
    external: true
